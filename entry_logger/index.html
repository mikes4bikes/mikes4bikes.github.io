<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entry Logger</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --primary-color: #4a5568;
            --accent-color: #3182ce;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            color: var(--primary-color);
            margin: 0;
            padding: 0;
        }

        .layout-container {
            display: grid;
            grid-template-columns: 1fr minmax(320px, 400px) 1fr;
            gap: 1rem;
            height: 100vh;
        }

        .list-container {
            height: 100vh;
            overflow-y: auto;
            padding: 1rem;
            background-color: #e5e7eb;
            border-radius: 0.75rem;
            box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.06);
        }

        .center-container {
            position: sticky;
            top: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 1rem;
            height: 100vh;
        }

        .date-separator, .tag-separator {
            background-color: #cbd5e1;
            color: #4a5568;
            font-weight: bold;
            padding: 0.25rem 0.5rem;
            border-radius: 9999px;
            margin: 1rem 0;
            text-align: center;
        }

        .entry-card {
            background-color: #fff;
            padding: 1rem;
            border-radius: 0.5rem;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
            margin-bottom: 0.75rem;
            word-wrap: break-word;
            cursor: grab;
            transition: background-color 0.2s, box-shadow 0.2s;
        }
        
        .entry-card:hover {
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }
        
        .entry-card.dragging {
            opacity: 0.4;
        }

        .entry-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 0.5rem;
            color: #718096;
            font-size: 0.875rem;
        }

        .delete-btn, .signout-btn, .edit-btn, .save-btn, .cancel-btn {
            cursor: pointer;
            transition: transform 0.2s;
        }

        .delete-btn:hover, .signout-btn:hover, .edit-btn:hover, .save-btn:hover, .cancel-btn:hover {
            transform: scale(1.1);
        }

        textarea {
            resize: none;
        }

        .prompt-box {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 50;
            padding: 2rem;
            background-color: #fff;
            border-radius: 1rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            max-width: 90%;
            width: 400px;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 100;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.4);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            text-align: center;
        }
        
        .attachment-list {
            list-style: none;
            padding: 0;
            margin-top: 0.5rem;
        }
        
        .attachment-list li {
            font-size: 0.8rem;
            margin-top: 0.25rem;
        }
    </style>
</head>
<body>

    <!-- Authentication Modal -->
    <div id="authModal" class="modal">
        <div class="modal-content">
            <h2 class="text-2xl font-bold mb-4">Welcome Back</h2>
            <button id="googleSignInBtn" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded-lg flex items-center justify-center w-full">
                <svg class="w-5 h-5 mr-2" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.658 4.103-5.264 7.151-9.986 7.151-5.718 0-10.342-4.624-10.342-10.342 0-5.718 4.624-10.342 10.342-10.342 3.265 0 6.275 1.701 7.915 4.426l5.962-3.702c-3.323-5.59-9.155-9.42-16.142-9.42C12.388 6.551 6 12.939 6 20.803c0 7.864 6.388 14.252 14.252 14.252 8.081 0 14.227-6.088 14.227-14.252 0-.964-.13-1.921-.365-2.839z" />
                    <path fill="#FF3D00" d="M6 20.803c0 1.932.35 3.799.986 5.518l5.882-4.576c-.469-1.353-.733-2.816-.733-4.102z" />
                    <path fill="#4CAF50" d="M20.252 42.051c-4.482 0-8.62-2.185-11.288-5.79l5.962-4.735c2.193 2.768 5.627 4.542 9.531 4.542 5.093 0 9.073-2.617 11.288-6.61l5.961 3.702c-3.323 5.59-9.155 9.42-16.142 9.42z" />
                    <path fill="#1976D2" d="M43.611 20.083c0-1.125-.19-2.221-.524-3.235l-5.962 3.702c.235.918.365 1.874.365 2.839 0 7.42-5.464 12.012-11.288 12.012-4.16 0-7.484-1.841-9.531-4.542l-5.961 4.735c3.673 3.65 8.441 5.92 13.91 5.92 8.081 0 14.227-6.088 14.227-14.252 0-.964-.13-1.921-.365-2.839z" />
                </svg>
                Sign In with Google
            </button>
        </div>
    </div>

    <!-- Main App Content -->
    <div id="mainContent" class="hidden">
        <div class="layout-container">
            <!-- Notes Column -->
            <div id="notesList" class="list-container notes-list">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-2xl font-bold">Notes</h2>
                    <div class="flex items-center space-x-2">
                        <input type="date" id="notesDateFilter" class="p-1 rounded-md border border-gray-300">
                        <button id="showAllNotesBtn" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-1 px-3 rounded-lg text-sm transition-colors">Show All</button>
                    </div>
                </div>
                <div id="notesContainer">
                    <p class="text-gray-500 italic">Loading notes...</p>
                </div>
            </div>

            <!-- Central Content Container -->
            <div class="center-container">
                <div class="bg-white p-6 rounded-xl shadow-lg w-full">
                    <h1 class="text-3xl font-bold text-center mb-6">Entry Logger</h1>
                    <div class="mb-4">
                        <textarea id="entryTextarea" class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition-shadow" rows="4" placeholder="Enter a new entry..."></textarea>
                    </div>
                    <div class="flex justify-between space-x-2 mb-4">
                        <button id="saveNotesBtn" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition-colors">
                            Save Notes
                        </button>
                        <button id="saveWorkBtn" class="flex-1 bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition-colors">
                            Save Work
                        </button>
                    </div>
                    <div class="flex flex-col space-y-2 text-center">
                        <label for="intervalInput" class="text-sm font-semibold">Prompt Interval (minutes)</label>
                        <input type="number" id="intervalInput" value="60" min="1" class="p-2 border border-gray-300 rounded-lg text-center focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <button id="startTimerBtn" class="bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-2 px-4 rounded-xl shadow-lg transition-colors">
                            Start Prompt Timer
                        </button>
                    </div>
                    <div id="nextTimes" class="mt-4 text-sm text-center"></div>
                    <div class="mt-6 flex justify-between space-x-2">
                        <button id="exportNotesCsvBtn" class="flex-1 bg-gray-500 hover:bg-gray-600 text-white font-bold py-2 px-3 rounded-xl shadow-lg transition-colors text-sm">
                            Export Notes CSV
                        </button>
                        <button id="exportWorkCsvBtn" class="flex-1 bg-gray-500 hover:bg-gray-600 text-white font-bold py-2 px-3 rounded-xl shadow-lg transition-colors text-sm">
                            Export Work CSV
                        </button>
                        <button id="importCsvBtn" class="bg-purple-500 hover:bg-purple-600 text-white font-bold py-2 px-3 rounded-xl shadow-lg transition-colors text-sm">
                            Import CSV
                        </button>
                        <input type="file" id="csvFileInput" class="hidden" accept=".csv">
                    </div>
                    <div class="mt-4 text-center flex justify-center space-x-4">
                        <button id="deleteAllBtn" class="text-red-500 hover:text-red-700 font-semibold text-sm transition-colors">Delete All Entries</button>
                        <button id="signOutBtn" class="text-red-500 hover:text-red-700 font-semibold text-sm transition-colors">Sign Out</button>
                    </div>
                    <p id="userIdDisplay" class="text-xs text-gray-400 mt-2 text-center"></p>
                </div>
            </div>
            
            <!-- Work Column -->
            <div id="workList" class="list-container work-list">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-2xl font-bold">Work</h2>
                    <div class="flex items-center space-x-2">
                        <input type="date" id="workDateFilter" class="p-1 rounded-md border border-gray-300">
                        <button id="showAllWorkBtn" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-1 px-3 rounded-lg text-sm transition-colors">Show All</button>
                    </div>
                </div>
                <div id="workContainer">
                    <p class="text-gray-500 italic">Loading work...</p>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Prompt Modal -->
    <div id="promptModal" class="prompt-box hidden">
        <h3 class="text-xl font-bold mb-4">What are you working on?</h3>
        <textarea id="promptTextarea" class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition-shadow" rows="3"></textarea>
        <div class="flex justify-between mt-4">
            <button id="savePromptBtn" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-xl transition-colors mr-2">
                Save
            </button>
            <button id="dismissPromptBtn" class="flex-1 bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-4 rounded-xl transition-colors">
                Dismiss
            </button>
        </div>
    </div>
    
    <!-- Message Modal -->
    <div id="messageBox" class="modal">
        <div class="modal-content">
            <p id="messageText" class="mb-4 text-gray-800"></p>
        </div>
    </div>

    <!-- Confirmation Modal -->
    <div id="confirmModal" class="modal">
        <div class="modal-content">
            <p id="confirmText" class="mb-4 text-gray-800 font-bold"></p>
            <div class="flex justify-center space-x-4">
                <button id="confirmYesBtn" class="bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-4 rounded-lg">Yes, delete all</button>
                <button id="confirmCancelBtn" class="bg-gray-500 hover:bg-gray-600 text-white font-bold py-2 px-4 rounded-lg">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <h3 class="text-xl font-bold mb-4">Edit Entry</h3>
            <textarea id="editTextarea" class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition-shadow" rows="4"></textarea>
            <div class="flex flex-col md:flex-row md:space-x-4 mt-4">
                <div class="flex-1 flex flex-col">
                    <label for="editDate" class="text-sm font-semibold text-left">Date</label>
                    <input type="date" id="editDate" class="p-2 border border-gray-300 rounded-lg">
                </div>
                <div class="flex-1 flex flex-col mt-4 md:mt-0">
                    <label for="editTime" class="text-sm font-semibold text-left">Time</label>
                    <input type="time" id="editTime" class="p-2 border border-gray-300 rounded-lg">
                </div>
            </div>
            <div class="flex justify-end space-x-4 mt-4">
                <button id="editSaveBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-xl transition-colors">
                    Save
                </button>
                <button id="editCancelBtn" class="bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-4 rounded-xl transition-colors">
                    Cancel
                </button>
            </div>
        </div>
    </div>


    <audio id="beepAudio" src="https://mikes4bikes.github.io/Int_Timer/videos/beep.mp3" preload="auto"></audio>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, where, serverTimestamp, deleteDoc, doc, getDocs, updateDoc, writeBatch } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase configuration and initialization
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = {
            apiKey: "AIzaSyBE7RBiMWeRGQ0UkTKUx5qDUQ7WUpPX_Mk",
            authDomain: "entry-logger1967.firebaseapp.com",
            projectId: "entry-logger1967",
            storageBucket: "entry-logger1967.firebasestorage.app",
            messagingSenderId: "386868272354",
            appId: "1:386868272354:web:8ab1d4de522664836392bb",
            measurementId: "G-B9LB74CS5X"
        };
        
        let app, db, auth;
        try {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
        } catch (error) {
            console.error("Firebase initialization failed:", error);
        }

        // DOM Elements
        const authModal = document.getElementById('authModal');
        const googleSignInBtn = document.getElementById('googleSignInBtn');
        const mainContent = document.getElementById('mainContent');
        const signOutBtn = document.getElementById('signOutBtn');
        const userIdDisplay = document.getElementById('userIdDisplay');

        const entryTextarea = document.getElementById('entryTextarea');
        const saveNotesBtn = document.getElementById('saveNotesBtn');
        const saveWorkBtn = document.getElementById('saveWorkBtn');
        
        const notesList = document.getElementById('notesList');
        const workList = document.getElementById('workList');
        const notesContainer = document.getElementById('notesContainer');
        const workContainer = document.getElementById('workContainer');
        
        const notesDateFilter = document.getElementById('notesDateFilter');
        const workDateFilter = document.getElementById('workDateFilter');
        const showAllNotesBtn = document.getElementById('showAllNotesBtn');
        const showAllWorkBtn = document.getElementById('showAllWorkBtn');
        
        const exportNotesCsvBtn = document.getElementById('exportNotesCsvBtn');
        const exportWorkCsvBtn = document.getElementById('exportWorkCsvBtn');
        const importCsvBtn = document.getElementById('importCsvBtn');
        const csvFileInput = document.getElementById('csvFileInput');

        const promptModal = document.getElementById('promptModal');
        const promptTextarea = document.getElementById('promptTextarea');
        const savePromptBtn = document.getElementById('savePromptBtn');
        const dismissPromptBtn = document.getElementById('dismissPromptBtn');
        const startTimerBtn = document.getElementById('startTimerBtn');
        const intervalInput = document.getElementById('intervalInput');
        const nextTimesEl = document.getElementById('nextTimes');
        const beepAudio = document.getElementById('beepAudio');
        
        const messageBox = document.getElementById('messageBox');
        const messageText = document.getElementById('messageText');
        
        const confirmModal = document.getElementById('confirmModal');
        const confirmText = document.getElementById('confirmText');
        const confirmYesBtn = document.getElementById('confirmYesBtn');
        const confirmCancelBtn = document.getElementById('confirmCancelBtn');

        const editModal = document.getElementById('editModal');
        const editTextarea = document.getElementById('editTextarea');
        const editDate = document.getElementById('editDate');
        const editTime = document.getElementById('editTime');
        const editSaveBtn = document.getElementById('editSaveBtn');
        const editCancelBtn = document.getElementById('editCancelBtn');
        
        const deleteAllBtn = document.getElementById('deleteAllBtn');

        let timerId = null;
        let tabFlashing = false;
        let originalTitle = document.title;
        let messageTimeoutId = null;
        let editingEntryId = null;
        let stopFlashingCallback = null;

        const showMessage = (message, autoHide = true) => {
            messageText.textContent = message;
            messageBox.style.display = 'flex';
            if (autoHide) {
                if (messageTimeoutId) {
                    clearTimeout(messageTimeoutId);
                }
                messageTimeoutId = setTimeout(() => {
                    messageBox.style.display = 'none';
                    messageTimeoutId = null;
                }, 3000); // Hide after 3 seconds
            }
        };

        const flashTab = (message) => {
            if (tabFlashing) return;
            tabFlashing = true;
            let count = 0;
            const interval = setInterval(() => {
                document.title = (count % 2 === 0) ? message : originalTitle;
                count++;
            }, 1000);
            return () => {
                clearInterval(interval);
                document.title = originalTitle;
                tabFlashing = false;
            };
        };
        
        const getTags = (text) => {
            const regex = /#(\w+)/g;
            const matches = text.match(regex) || [];
            return matches.map(tag => tag.substring(1).toLowerCase());
        };

        const saveEntry = async (text, type, userId) => {
            if (!text.trim()) return;
            
            const tags = getTags(text);
            const entryData = {
                text,
                type,
                tags,
                timestamp: serverTimestamp()
            };

            try {
                const docRef = await addDoc(collection(db, `/artifacts/${appId}/users/${userId}/entries`), entryData);
                showMessage(`New ${type} saved!`);
                console.log("Document written with ID: ", docRef.id);
            } catch (e) {
                console.error("Error adding document: ", e);
                showMessage("Failed to save entry. Please check the console for details.", false);
            }
        };
        
        const deleteEntry = async (id, userId) => {
            try {
                await deleteDoc(doc(db, `/artifacts/${appId}/users/${userId}/entries`, id));
                showMessage("Entry deleted successfully!");
            } catch (e) {
                console.error("Error deleting document: ", e);
                showMessage("Failed to delete entry. Please check the console for details.", false);
            }
        };

        const updateEntry = async (id, newText, newTimestamp, userId) => {
            const tags = getTags(newText);
            try {
                await updateDoc(doc(db, `/artifacts/${appId}/users/${userId}/entries`, id), {
                    text: newText,
                    timestamp: newTimestamp,
                    tags: tags,
                });
                showMessage("Entry updated successfully!");
            } catch (e) {
                console.error("Error updating document:", e);
                showMessage("Failed to update entry. Please check the console for details.", false);
            }
        };
        
        const moveEntry = async (id, newType, userId) => {
            try {
                await updateDoc(doc(db, `/artifacts/${appId}/users/${userId}/entries`, id), {
                    type: newType
                });
                showMessage(`Entry moved to ${newType}!`);
            } catch (e) {
                console.error("Error moving entry:", e);
                showMessage("Failed to move entry. Please check the console for details.", false);
            }
        };

        const deleteAllEntries = async () => {
            const userId = auth.currentUser?.uid;
            if (!userId) {
                showMessage("You must be signed in to delete entries.", false);
                return;
            }
            
            const entriesRef = collection(db, `/artifacts/${appId}/users/${userId}/entries`);
            const snapshot = await getDocs(entriesRef);
            if (snapshot.empty) {
                showMessage("No entries to delete.", false);
                return;
            }

            const batch = writeBatch(db);
            snapshot.docs.forEach(doc => {
                batch.delete(doc.ref);
            });

            try {
                await batch.commit();
                showMessage("All entries deleted successfully!");
                console.log("All entries have been deleted.");
            } catch (e) {
                console.error("Error deleting all documents:", e);
                showMessage("Failed to delete all entries. Please check the console for details.", false);
            }
        };

        const getEntries = (container, type, filterDate = null, filterTag = null) => {
            const userId = auth.currentUser?.uid;
            if (!userId) {
                container.innerHTML = `<p class="text-gray-500 italic">No entries found for your account.</p>`;
                return;
            }

            let entriesQuery = query(collection(db, `/artifacts/${appId}/users/${userId}/entries`), where('type', '==', type));
            if (filterTag) {
                entriesQuery = query(entriesQuery, where('tags', 'array-contains', filterTag));
            }

            onSnapshot(entriesQuery, (snapshot) => {
                const entries = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderEntries(entries, container, type, filterDate);
            }, (error) => {
                console.error("Error fetching entries:", error);
                container.innerHTML = `<p class="text-red-500">Error loading entries: ${error.message}</p>`;
            });
        };

        const renderEntries = (entries, container, type, filterDate) => {
            container.innerHTML = '';
            
            const filteredEntries = filterDate
                ? entries.filter(e => {
                    if (!e.timestamp) return false;
                    const entryDate = new Date(e.timestamp.seconds * 1000);
                    return entryDate.toDateString() === filterDate.toDateString();
                })
                : entries;

            if (filteredEntries.length === 0) {
                container.innerHTML = '<p class="text-gray-500 italic">No entries found.</p>';
                return;
            }
            
            const sortedEntries = filteredEntries.sort((a, b) => b.timestamp.toMillis() - a.timestamp.toMillis());
            
            let lastDate = null;
            sortedEntries.forEach(entry => {
                const entryDate = entry.timestamp ? new Date(entry.timestamp.seconds * 1000) : null;
                const dateString = entryDate ? entryDate.toLocaleDateString() : 'Unknown Date';
                
                if (dateString !== lastDate) {
                    const separator = document.createElement('div');
                    separator.className = 'date-separator';
                    separator.textContent = dateString;
                    container.appendChild(separator);
                    lastDate = dateString;
                }

                const formattedText = (entry.text || '').replace(/(https?:\/\/[^\s]+|www\.[^\s]+)/g, (url) => {
                    const href = url.startsWith('http') ? url : `https://${url}`;
                    return `<a href="${href}" target="_blank" class="text-blue-500 hover:underline">${url}</a>`;
                }).replace(/#(\w+)/g, (tag, tagName) => {
                    return `<a href="#" class="text-indigo-600 hover:text-indigo-800 font-semibold" data-tag="${tagName.toLowerCase()}">${tag}</a>`;
                });

                const entryEl = document.createElement('div');
                entryEl.className = 'entry-card';
                entryEl.draggable = true;
                entryEl.dataset.id = entry.id;
                entryEl.dataset.type = type;

                entryEl.innerHTML = `
                    <div class="entry-content">
                        <p class="text-gray-800">${formattedText || 'No text content'}</p>
                    </div>
                    <div class="entry-footer">
                        <span class="text-xs">${entryDate ? entryDate.toLocaleTimeString() : 'Loading...'}</span>
                        <div class="flex space-x-2">
                            <button class="edit-btn" data-id="${entry.id}">
                                <svg class="w-4 h-4 text-gray-500 hover:text-gray-600 transition-colors" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M17.414 2.586a2 2 0 00-2.828 0L7 10.172V13h2.828l7.586-7.586a2 2 0 000-2.828zM4 14v1a1 1 0 001 1h1a1 1 0 001-1v-1a1 1 0 00-1-1H5a1 1 0 00-1 1z"></path>
                                </svg>
                            </button>
                            <button class="delete-btn" data-id="${entry.id}">
                                <svg class="w-4 h-4 text-red-500 hover:text-red-600 transition-colors" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                                    <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm6 0a1 1 0 012 0v6a1 1 0 11-2 0V8z" clip-rule="evenodd"></path>
                                </svg>
                            </button>
                        </div>
                    </div>
                `;
                container.appendChild(entryEl);
            });

            container.querySelectorAll('a[data-tag]').forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    const tag = e.currentTarget.dataset.tag;
                    if (type === 'notes') {
                        getEntries(notesContainer, 'notes', null, tag);
                    } else if (type === 'work') {
                        getEntries(workContainer, 'work', null, tag);
                    }
                });
            });

            container.querySelectorAll('.delete-btn').forEach(button => {
                button.addEventListener('click', (e) => {
                    const entryId = e.currentTarget.dataset.id;
                    const userId = auth.currentUser?.uid;
                    if (userId) {
                        deleteEntry(entryId, userId);
                    }
                });
            });

            container.querySelectorAll('.entry-card').forEach(card => {
                card.addEventListener('dragstart', (e) => {
                    e.currentTarget.classList.add('dragging');
                    e.dataTransfer.setData('text/plain', JSON.stringify({ id: e.currentTarget.dataset.id, type: e.currentTarget.dataset.type }));
                });
                card.addEventListener('dragend', (e) => {
                    e.currentTarget.classList.remove('dragging');
                });
                card.addEventListener('dblclick', (e) => {
                    const entryId = e.currentTarget.dataset.id;
                    const entry = entries.find(e => e.id === entryId);
                    if (entry) {
                        editingEntryId = entryId;
                        const entryDate = entry.timestamp ? new Date(entry.timestamp.seconds * 1000) : new Date();
                        
                        const pad = (num) => num < 10 ? '0' + num : num;
                        const dateString = `${entryDate.getFullYear()}-${pad(entryDate.getMonth() + 1)}-${pad(entryDate.getDate())}`;
                        const timeString = `${pad(entryDate.getHours())}:${pad(entryDate.getMinutes())}`;
                        
                        editTextarea.value = entry.text;
                        editDate.value = dateString;
                        editTime.value = timeString;
                        editModal.style.display = 'flex';
                    }
                });
            });

            container.querySelectorAll('.edit-btn').forEach(button => {
                button.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const card = e.currentTarget.closest('.entry-card');
                    const entryId = e.currentTarget.dataset.id;
                    const entry = entries.find(e => e.id === entryId);
                    if (entry) {
                        editingEntryId = entryId;
                        const entryDate = entry.timestamp ? new Date(entry.timestamp.seconds * 1000) : new Date();
                        
                        const pad = (num) => num < 10 ? '0' + num : num;
                        const dateString = `${entryDate.getFullYear()}-${pad(entryDate.getMonth() + 1)}-${pad(entryDate.getDate())}`;
                        const timeString = `${pad(entryDate.getHours())}:${pad(entryDate.getMinutes())}`;
                        
                        editTextarea.value = entry.text;
                        editDate.value = dateString;
                        editTime.value = timeString;
                        editModal.style.display = 'flex';
                    }
                });
            });
        };

        editSaveBtn.addEventListener('click', () => {
            const userId = auth.currentUser?.uid;
            if (!userId || !editingEntryId) return;
            
            const newText = editTextarea.value.trim();
            const newDate = editDate.value;
            const newTime = editTime.value;

            if (!newText || !newDate || !newTime) {
                showMessage("Text, date, and time cannot be empty.", false);
                return;
            }

            const newTimestamp = new Date(`${newDate}T${newTime}`);
            if (isNaN(newTimestamp)) {
                showMessage("Invalid date or time format.", false);
                return;
            }

            updateEntry(editingEntryId, newText, newTimestamp, userId);
            editModal.style.display = 'none';
        });

        editCancelBtn.addEventListener('click', () => {
            editModal.style.display = 'none';
            editingEntryId = null;
        });

        notesList.addEventListener('dragover', (e) => {
            e.preventDefault();
            notesList.classList.add('bg-blue-200');
        });
        notesList.addEventListener('dragleave', (e) => {
            notesList.classList.remove('bg-blue-200');
        });
        notesList.addEventListener('drop', (e) => {
            e.preventDefault();
            notesList.classList.remove('bg-blue-200');
            const data = JSON.parse(e.dataTransfer.getData('text/plain'));
            if (data.type !== 'notes') {
                moveEntry(data.id, 'notes', auth.currentUser?.uid);
            }
        });

        workList.addEventListener('dragover', (e) => {
            e.preventDefault();
            workList.classList.add('bg-green-200');
        });
        workList.addEventListener('dragleave', (e) => {
            workList.classList.remove('bg-green-200');
        });
        workList.addEventListener('drop', (e) => {
            e.preventDefault();
            workList.classList.remove('bg-green-200');
            const data = JSON.parse(e.dataTransfer.getData('text/plain'));
            if (data.type !== 'work') {
                moveEntry(data.id, 'work', auth.currentUser?.uid);
            }
        });

        const exportCsv = async (type) => {
            const userId = auth.currentUser?.uid;
            if (!userId) {
                showMessage("You must be signed in to export data.", false);
                return;
            }

            let entries = [];
            const filterDate = type === 'notes' ? notesDateFilter.value : workDateFilter.value;

            if (filterDate) {
                const formattedDate = new Date(filterDate);
                const querySnapshot = await getDocs(query(collection(db, `/artifacts/${appId}/users/${userId}/entries`), where('type', '==', type)));
                entries = querySnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })).filter(e => {
                    if (!e.timestamp) return false;
                    const entryDate = new Date(e.timestamp.seconds * 1000);
                    return entryDate.toDateString() === formattedDate.toDateString();
                });
            } else {
                const querySnapshot = await getDocs(query(collection(db, `/artifacts/${appId}/users/${userId}/entries`), where('type', '==', type)));
                entries = querySnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            }
            
            if (entries.length === 0) {
                showMessage(`No ${type} entries to export.`, false);
                return;
            }
            
            const header = 'Text,Type,Timestamp\n';
            const rows = entries.map(e => {
                const text = `"${e.text.replace(/"/g, '""')}"`;
                const type = e.type || '';
                const timestamp = e.timestamp ? new Date(e.timestamp.seconds * 1000).toLocaleString() : '';
                return `${text},${type},${timestamp}`;
            }).join('\n');

            const csv = header + rows;
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.setAttribute('href', url);
            link.setAttribute('download', `${type}_entries.csv`);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showMessage(`Exported ${entries.length} ${type} entries.`);
        };
        
        const importCsv = () => {
            csvFileInput.click();
        };

        csvFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async (event) => {
                const csvText = event.target.result;
                const lines = csvText.split('\n').filter(line => line.trim() !== '');
                if (lines.length <= 1) {
                    showMessage("CSV is empty or has only headers.", false);
                    return;
                }

                const header = lines[0].split(',').map(h => h.trim().replace(/"/g, ''));
                const textIndex = header.indexOf('Text');
                const typeIndex = header.indexOf('Type');
                const timestampIndex = header.indexOf('Timestamp');

                if (textIndex === -1 || typeIndex === -1 || timestampIndex === -1) {
                    showMessage("CSV is missing 'Text', 'Type', or 'Timestamp' columns.", false);
                    return;
                }
                
                const userId = auth.currentUser?.uid;
                if (!userId) {
                    showMessage("You must be signed in to import data.", false);
                    return;
                }
                
                let importCount = 0;
                for (let i = 1; i < lines.length; i++) {
                    const values = lines[i].match(/(?:"[^"]*"|[^,])+/g).map(v => v.trim().replace(/"/g, ''));
                    if (values.length > 0) {
                        const text = values[textIndex];
                        const type = values[typeIndex] || 'notes'; 
                        const date = values[timestampIndex];
                        const time = values.length > timestampIndex + 1 ? values[timestampIndex + 1] : '00:00:00';
                        
                        let entryTimestamp = serverTimestamp();
                        try {
                            const combinedDate = new Date(`${date} ${time}`);
                            if (!isNaN(combinedDate.getTime())) {
                                entryTimestamp = combinedDate;
                            } else {
                                console.warn(`Invalid date format for entry: ${lines[i]}. Using server timestamp.`);
                            }
                        } catch (error) {
                            console.warn(`Error parsing date for entry: ${lines[i]}. Using server timestamp.`, error);
                        }

                        await addDoc(collection(db, `/artifacts/${appId}/users/${userId}/entries`), {
                            text,
                            type,
                            timestamp: entryTimestamp
                        });
                        importCount++;
                    }
                }
                showMessage(`Successfully imported ${importCount} entries.`);
            };
            reader.readAsText(file);
        });

        // Event listeners
        saveNotesBtn.addEventListener('click', () => {
            saveEntry(entryTextarea.value, 'notes', auth.currentUser?.uid);
            entryTextarea.value = '';
        });
        saveWorkBtn.addEventListener('click', () => {
            saveEntry(entryTextarea.value, 'work', auth.currentUser?.uid);
            entryTextarea.value = '';
        });
        exportNotesCsvBtn.addEventListener('click', () => exportCsv('notes'));
        exportWorkCsvBtn.addEventListener('click', () => exportCsv('work'));
        importCsvBtn.addEventListener('click', importCsv);
        
        notesDateFilter.addEventListener('change', (e) => {
            const selectedDate = new Date(e.target.value);
            getEntries(notesContainer, 'notes', selectedDate);
        });

        showAllNotesBtn.addEventListener('click', () => {
            notesDateFilter.value = '';
            getEntries(notesContainer, 'notes');
        });

        workDateFilter.addEventListener('change', (e) => {
            const selectedDate = new Date(e.target.value);
            getEntries(workContainer, 'work', selectedDate);
        });

        showAllWorkBtn.addEventListener('click', () => {
            workDateFilter.value = '';
            getEntries(workContainer, 'work');
        });
        
        deleteAllBtn.addEventListener('click', () => {
            confirmText.textContent = "Are you sure you want to delete all entries? This action cannot be undone.";
            confirmModal.style.display = 'flex';
        });

        confirmYesBtn.addEventListener('click', () => {
            deleteAllEntries();
            confirmModal.style.display = 'none';
        });

        confirmCancelBtn.addEventListener('click', () => {
            confirmModal.style.display = 'none';
        });

        startTimerBtn.addEventListener('click', () => {
            const intervalMinutes = parseInt(intervalInput.value, 10);
            if (timerId) {
                clearInterval(timerId); // Clear any existing timer
            }
            if (isNaN(intervalMinutes) || intervalMinutes <= 0) {
                showMessage("Please enter a valid interval in minutes.", false);
                return;
            }
            
            const nextTwentyTimes = [];
            let currentTime = new Date();
            for (let i = 0; i < 20; i++) {
                currentTime.setMinutes(currentTime.getMinutes() + intervalMinutes);
                nextTwentyTimes.push(currentTime.toLocaleTimeString('en-US', { hour12: false }));
            }
            nextTimesEl.innerHTML = `Next prompts: ${nextTwentyTimes.join(', ')}`;
            
            const showPrompt = () => {
                beepAudio.play().catch(e => console.error("Audio playback failed:", e));
                promptModal.classList.remove('hidden');
                stopFlashingCallback = flashTab("What are you working on?");
            };

            // Run immediately and then at intervals
            showPrompt();
            timerId = setInterval(showPrompt, intervalMinutes * 60 * 1000);
            
            showMessage(`Prompt timer started for ${intervalMinutes} minute intervals.`);
        });

        savePromptBtn.addEventListener('click', () => {
            saveEntry(promptTextarea.value, 'work', auth.currentUser?.uid);
            promptTextarea.value = '';
            promptModal.classList.add('hidden');
            if (stopFlashingCallback) {
                stopFlashingCallback();
                stopFlashingCallback = null;
            }
        });

        dismissPromptBtn.addEventListener('click', () => {
            promptTextarea.value = '';
            promptModal.classList.add('hidden');
            if (stopFlashingCallback) {
                stopFlashingCallback();
                stopFlashingCallback = null;
            }
        });
        
        // Firebase Authentication
        const googleProvider = new GoogleAuthProvider();
        googleSignInBtn.addEventListener('click', () => {
            signInWithPopup(auth, googleProvider)
                .catch((error) => {
                    console.error("Google Sign-in failed:", error);
                    showMessage("Google Sign-in failed. Please check your console.", false);
                });
        });

        signOutBtn.addEventListener('click', () => {
            signOut(auth).then(() => {
                console.log("User signed out.");
                showMessage("You have been signed out.");
            }).catch((error) => {
                console.error("Sign out error:", error);
                showMessage("Sign out failed.", false);
            });
        });

        onAuthStateChanged(auth, (user) => {
            if (user) {
                console.log("User is signed in:", user.uid);
                authModal.style.display = 'none';
                mainContent.classList.remove('hidden');
                userIdDisplay.textContent = `User ID: ${user.uid}`;
                getEntries(notesContainer, 'notes');
                getEntries(workContainer, 'work');
            } else {
                console.log("User is signed out.");
                authModal.style.display = 'flex';
                mainContent.classList.add('hidden');
                notesContainer.innerHTML = '<p class="text-gray-500 italic">Please sign in to view your notes.</p>';
                workContainer.innerHTML = '<p class="text-gray-500 italic">Please sign in to view your work.</p>';
                userIdDisplay.textContent = '';
            }
        });

    </script>
</body>
</html>
